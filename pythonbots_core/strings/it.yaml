core.comando-sconosciuto: "Comando non riconosciuto."

core.occupato: "Il bot è occupato in questo momento: riprova fra qualche secondo."

core.copia-titolo: "La copia dei tuoi dati"
core.copia-spiegazione: "Il pulsante scarica un file con i dati che il bot conserva su di te. Il link funziona una volta sola."
core.copia-pulsante: "Scarica i miei dati"
core.copia-non-valida: "Questo link non è valido: è già stato usato, è scaduto, oppure non è mai esistito. Chiedi di nuovo la copia al bot."

diritti.copia: |
  Ecco i dati che conservo su di te: la copia completa è nel file allegato. Righe per tabella:

  {riassunto}

  Il tuo identificativo Discord non è conservato in chiaro: al suo posto c'è uno pseudonimo.
  L'informativa completa è nella pagina di questa app su Discord, alla voce Privacy Policy.

diritti.copia-link: |
  Conservo su di te più dati di quanti ne entrino in un file qui su Discord. Righe per tabella:

  {riassunto}

  Scarica la copia completa da qui, entro 15 minuti; il link funziona una volta sola:
  <{link}>

diritti.copia-troppo-grande: |
  Conservo su di te più dati di quanti ne entrino in un file qui su Discord. Righe per tabella:

  {riassunto}

  Per la copia completa scrivi al contatto indicato nell'informativa, nella pagina di questa app
  su Discord alla voce Privacy Policy.

diritti.nulla-da-mostrare: |
  Non conservo nessun dato su di te: non c'è una copia da darti perché non c'è una copia.
  L'informativa completa è nella pagina di questa app su Discord, alla voce Privacy Policy.

diritti.cancellato: |
  Fatto: ho cancellato {quante} righe che ti riguardavano.

  Non cancello i messaggi che hai scritto nel server: quelli restano tuoi e della piattaforma.

diritti.nulla-da-cancellare: |
  Fatto — anche se non c'era niente da cancellare.

  Non conservavo nessun dato su di te, quindi non è cambiato nulla. Te lo dico lo stesso
  invece di tacere: un comando che risponde «ok» senza spiegare lascia il dubbio che
  qualcosa sia stato cancellato di nascosto.
